name: nexaround_app
description: "NexAround - AI-powered smart tourism companion"
publish_to: 'none'
# Build number for iOS and Android. The name (1.0.4) is the source of truth for
# both stores; the +162 only applies to local builds, since CI overrides it with
# an auto-incrementing value. See .github/workflows/build_apk.yml.
version: 1.0.10+171
environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: 9.1.1
  equatable: 2.0.8
  freezed_annotation: 3.1.0

  # Routing
  go_router: 17.2.3

  # Networking
  dio: 5.9.2
  retrofit: 4.9.2

  # Dependency Injection
  get_it: 9.2.1
  injectable: 2.7.1+4

  # Location & Maps
  geolocator: 9.0.2
  google_maps_flutter: 2.17.0
  google_maps_flutter_android: 2.19.8
  google_maps_flutter_platform_interface: 2.15.0
  camera: 0.11.4
  image_picker: 1.2.2

  # Local Storage
  hive_flutter: 1.1.0
  shared_preferences: 2.5.5

  # Firebase
  firebase_core: 4.9.0
  firebase_auth: 6.5.1
  firebase_messaging: 16.2.2

  # UI
  cached_network_image: 3.4.1
  shimmer: 3.0.0
  lottie: 3.3.3
  video_player: 2.11.1
  flutter_animate: 4.5.2

  # Utilities
  dartz: 0.10.1
  json_annotation: 4.12.0
  intl: 0.20.2
  permission_handler: 12.0.1
  speech_to_text: 7.4.0
  connectivity_plus: 6.1.5
  cupertino_icons: 1.0.9
  uuid: 4.5.3
  flutter_map: 8.3.0
  latlong2: 0.9.1
  google_fonts: 8.1.0
  google_mlkit_object_detection: 0.15.1
  mapbox_maps_flutter: 2.24.2
  url_launcher: 6.3.2
  # The phone's own share menu, for "More" in experience_share_sheet.dart.
  share_plus: 13.3.0
  # Direct Facebook / Instagram Stories sharing. A local plugin because its iOS
  # side needs Facebook's share kit (see packages/nexaround_share).
  nexaround_share:
    path: packages/nexaround_share
  flutter_compass: 0.8.1
  sensors_plus: 6.1.2
  google_generative_ai: 0.4.7
  http: 1.6.0
  # Social Auth
  google_sign_in: 7.2.0
  sign_in_with_apple: 6.1.4
  flutter_markdown: 0.7.7+1
  flutter_appauth: 12.0.1
  googleapis: 16.0.0
  googleapis_auth: 2.3.2
  extension_google_sign_in_as_googleapis_auth: 3.0.0
  image: 4.9.1
  # Analytics & Ad Attribution
  facebook_app_events: 0.30.5

dependency_overrides:
  latlong2:
    path: ./packages/latlong2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.0
  freezed: 3.2.5
  json_serializable: 6.14.0
  injectable_generator: 2.12.1
  bloc_test: 10.0.0
  mocktail: 1.0.5
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/neva_avatar.png
    - assets/images/hero_luxury.png
    - assets/images/lotus_temple.png
    - assets/images/ar_labels_discovery.png
    - assets/images/odyssey_planner.png
    - assets/images/experiences_banner_bg.png
    - assets/images/walking_challenge_bg.jpg
    - assets/images/forum_banner_bg.jpg
    - assets/images/cat_hospital.png
    - assets/images/cat_nature.png
    - assets/images/cat_food.png
    - assets/images/cat_historical.png
    - assets/images/cat_shopping.png
    - assets/images/cat_medical.png
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # Build-time sources only — deliberately outside assets/ so they are not
  # bundled into the app. The generated launcher assets are committed under
  # android/app/src/main/res/ and ios/Runner/Assets.xcassets/.
  image_path: "tool/icons/app_icon.png"
  image_path_ios: "tool/icons/app_icon_ios.png"
  adaptive_icon_background: "#02555D"
  adaptive_icon_foreground: "tool/icons/app_icon_foreground.png"
  remove_alpha_ios: true

