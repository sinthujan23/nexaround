name: nexaround_app
description: "NexAround - AI-powered smart tourism companion"
publish_to: 'none'

version: 1.0.0+58

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.0
  freezed_annotation: ^3.1.0

  # Routing
  go_router: ^17.2.1

  # Networking
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.3.0

  # Location & Maps
  geolocator: ^9.0.2
  google_maps_flutter: ^2.6.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.2.0

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0

  # Utilities
  dartz: ^0.10.1
  json_annotation: ^4.8.0
  intl: ^0.20.2
  permission_handler: ^12.0.0
  speech_to_text: ^7.4.0
  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.6
  uuid: ^4.3.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  google_fonts: ^8.0.2
  google_mlkit_object_detection: ^0.15.1
  mapbox_maps_flutter: ^2.5.1
  url_launcher: ^6.2.5
  flutter_compass: ^0.8.1
  google_generative_ai: ^0.4.5
  http: ^1.2.1
  # Social Auth
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.1
  flutter_markdown: ^0.7.7+1
  flutter_appauth: ^12.0.1
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.2
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  image: ^4.8.0

dependency_overrides:
  latlong2:
    path: ./packages/latlong2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.2.5
  json_serializable: ^6.7.0
  injectable_generator: ^2.4.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/neva_avatar.png
    - assets/images/hero_luxury.png
    - assets/images/lotus_temple.png
    - assets/images/sigiriya.png
    - assets/images/food_corner.png
    - assets/images/craft_market.png
    - assets/markers/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_padded.png"
  adaptive_icon_background: "#F6EDA2"
  adaptive_icon_foreground: "assets/images/app_icon_padded.png"
  remove_alpha_ios: true
