# The admin panel is a single-page app with one URL per page (/users,
# /experiences, ...). Stock nginx:alpine would 404 a refresh on any of them,
# because no such file exists on disk; the SPA has to be served for any path
# and route itself.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
