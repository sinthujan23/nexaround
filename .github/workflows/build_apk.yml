name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'nexaround_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > nexaround_app/android/local.properties

      - name: Install dependencies
        working-directory: nexaround_app
        run: flutter pub get

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > nexaround_app/android/app/upload-keystore.jks
          cat <<EOF > nexaround_app/android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        working-directory: nexaround_app
        run: flutter build apk --split-per-abi --android-skip-build-dependency-validation

      - name: Build AAB
        working-directory: nexaround_app
        run: flutter build appbundle --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexaround-apk
          path: nexaround_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexaround-aab
          path: nexaround_app/build/app/outputs/bundle/release/*.aab
          retention-days: 1
