name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > nexaround_app/android/local.properties

      - name: Install dependencies
        working-directory: nexaround_app
        run: flutter pub get

      - name: Build APK
        working-directory: nexaround_app
        run: flutter build apk --split-per-abi

      - name: Build AAB
        working-directory: nexaround_app
        run: flutter build appbundle

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexaround-apk
          path: nexaround_app/build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexaround-aab
          path: nexaround_app/build/app/outputs/bundle/release/*.aab
