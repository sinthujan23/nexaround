name: Build Flutter iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}



    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up latest Xcode
        run: |
          echo "Available Xcode versions:"
          ls -1d /Applications/Xcode*.app
          # Find the highest version of Xcode
          LATEST_XCODE=$(ls -1d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Switching to $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: nexaround_app
        run: |
          flutter pub get
          flutter precache --ios

      - name: Install Apple Certificate and Provisioning Profile
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "temporary-keychain-password" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "temporary-keychain-password" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temporary-keychain-password" $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i $PP_PATH | grep -aA1 UUID | grep -o "[-A-Za-z0-9]\{36\}")
          echo "Profile UUID: $UUID"
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build iOS Application
        working-directory: nexaround_app
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "🔑 Building SIGNED iOS xcarchive..."
            
            # Extract Profile Name, Bundle ID, and Team ID from the provisioning profile
            security cms -D -i $RUNNER_TEMP/build_pp.mobileprovision > profile.plist
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" profile.plist)
            APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist)
            BUNDLE_ID=$(echo $APP_IDENTIFIER | sed 's/^[^\.]*\.//')
            TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" profile.plist 2>/dev/null || echo "R9YFWBF946")
            
            echo "Using Profile Name: $PROFILE_NAME"
            echo "Using Bundle ID: $BUNDLE_ID"
            echo "Using Team ID: $TEAM_ID"
            
            # Create base ExportOptions.plist
            echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/ExportOptions.plist
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/ExportOptions.plist
            echo '<plist version="1.0">' >> ios/ExportOptions.plist
            echo '<dict>' >> ios/ExportOptions.plist
            echo '    <key>method</key><string>app-store</string>' >> ios/ExportOptions.plist
            echo '    <key>signingStyle</key><string>manual</string>' >> ios/ExportOptions.plist
            echo '    <key>destination</key><string>export</string>' >> ios/ExportOptions.plist
            echo '    <key>provisioningProfiles</key><dict/>' >> ios/ExportOptions.plist
            echo '</dict>' >> ios/ExportOptions.plist
            echo '</plist>' >> ios/ExportOptions.plist

            /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ios/ExportOptions.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" ios/ExportOptions.plist 2>/dev/null || true
            
            # Dynamically ensure project.pbxproj matches the exact provisioned profile name and team
            sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" ios/Runner.xcodeproj/project.pbxproj
            if [ -n "$TEAM_ID" ]; then
              sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = $TEAM_ID;/g" ios/Runner.xcodeproj/project.pbxproj
            fi

            # Build and archive via Flutter
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
            
            # Fallback export if needed
            if ! ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
              echo "📦 Manually exporting IPA..."
              xcodebuild -exportArchive \
                -archivePath build/ios/archive/Runner.xcarchive \
                -exportPath build/ios/ipa \
                -exportOptionsPlist ios/ExportOptions.plist \
                -allowProvisioningUpdates || true
            fi

          else
            echo "📦 Building UNSIGNED iOS IPA..."
            flutter build ipa --no-codesign
            
            # Package unsigned .app into a standard .ipa zip structure for sideloading/manual signing
            echo "Packaging unsigned IPA..."
            mkdir -p build/ios/iphoneos/Payload
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/iphoneos/Payload/
            cd build/ios/iphoneos
            zip -r Runner.ipa Payload
          fi

      - name: Find IPA path
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        id: find-ipa
        working-directory: nexaround_app
        run: |
          echo "=== Listing build/ios directory ==="
          find build/ios -maxdepth 4 -name "*.ipa" 2>/dev/null || echo "No IPA found"
          find build/ios -maxdepth 4 -type d 2>/dev/null | head -20 || echo "Cannot list build dirs"
          echo "=== Searching for IPA ==="
          IPA_PATH=$(find build/ios -name "*.ipa" 2>/dev/null | head -n 1)
          echo "Relative IPA path: '$IPA_PATH'"
          if [ -n "$IPA_PATH" ]; then
            FULL_IPA_PATH="$GITHUB_WORKSPACE/nexaround_app/$IPA_PATH"
            echo "Full IPA path: '$FULL_IPA_PATH'"
            echo "ipa-path=$FULL_IPA_PATH" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No IPA file found! Build may have failed silently."
            exit 1
          fi


      - name: Upload to TestFlight
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.find-ipa.outputs.ipa-path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Clean up Keychain
        if: ${{ always() && env.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexaround-ipa
          path: |
            nexaround_app/build/ios/ipa/*.ipa
            nexaround_app/build/ios/iphoneos/Runner.ipa
          if-no-files-found: error
          retention-days: 1
