# The partner portal is a single-page app whose FIRST url is /set-password —
# the invite link. Stock nginx:alpine would 404 it, because the file does not
# exist on disk; the SPA has to be served for any path and route itself.
#
# The admin panel gets away without this because it only ever has one url.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
