# Development-only: runs ONLY the databases
# The FastAPI server runs directly on your machine for fast hot-reload
version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nexaround_db
    environment:
      POSTGRES_DB: nexaround
      POSTGRES_USER: nexaround
      POSTGRES_PASSWORD: nexaround
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaround"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexaround_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
