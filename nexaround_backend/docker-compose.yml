services:
  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    ports:
      # Bind to loopback only. Nginx (on the host) reaches the API at
      # 127.0.0.1:8010; publishing on 0.0.0.0 additionally exposed the API on
      # the public interface over plaintext HTTP, bypassing TLS and letting a
      # direct caller spoof X-Real-IP (defeating the auth rate limiter).
      - "127.0.0.1:8010:8000"
    environment:
      # Uvicorn reads this as its worker count, and app/core/database.py divides
      # the connection budget by it — one variable so the pool can never be
      # sized for a different number of processes than are actually running.
      # Two, on a 2-core box: a single event loop was hitting 100% CPU during
      # background-fill bursts, and /health (which does no work at all) was
      # taking 1.4s behind it.
      - WEB_CONCURRENCY=2
      # 70 of the 80-connection budget; the worker takes the other 10. See
      # app/core/database.py.
      - DB_CONNECTION_BUDGET=70
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
    volumes:
      - ./app:/app/app
      # Persist proxied place photos across container restarts.
      - photo_cache:/app/app/static/photo_cache
      # Firebase service-account credential (read-only, kept outside the repo).
      - /etc/nexaround/firebase-sa.json:/etc/nexaround/firebase-sa.json:ro
    depends_on:
      - db
      - redis
    # Ceilings, not targets. Steady RSS is ~277 MiB and the stress peak was
    # 280 MiB, so 1g is roughly 3.5x headroom — enough that a limit never fires
    # in normal operation, but bounded so a regression cannot take the host
    # down. (Before the lazy="raise" fix this container reached 1.64 GiB from a
    # handful of /categories/ calls, with nothing to stop it.)
    #
    # This host also runs ERPNext, Moodle, Ziggo, Seaty and Muslim Aid. cpus is
    # set so a runaway loop here cannot monopolise both cores; at 1.5 it is
    # above the measured 1.03-core peak and will not bind in normal use.
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Background process, same image as the api. Runs Odyssey generation (pulled
  # from a Redis queue — see app/core/job_queue.py) and the telemetry
  # rollup/alert loops, so 35–120 s Gemini chains never share an event loop or
  # a CPU cap with live requests, survive `compose restart api`, and are capped
  # at ODYSSEY_MAX_JOBS in flight. Restart it the same way as the api after a
  # code change: `docker compose restart worker`.
  worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      - DB_CONNECTION_BUDGET=10
      - ODYSSEY_MAX_JOBS=3
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
    volumes:
      - ./app:/app/app
      # The same photo volume as the api, or the two processes keep separate
      # caches: the worker wrote cover photos into the bind-mounted repo
      # directory, the api could not see them and bought each one again.
      - photo_cache:/app/app/static/photo_cache
      # The "Odyssey ready" push goes through Firebase.
      - /etc/nexaround/firebase-sa.json:/etc/nexaround/firebase-sa.json:ro
    depends_on:
      - db
      - redis
    # Three concurrent generations are mostly waiting on the network; CPU is
    # the JSON parsing of Gemini's replies. 0.5 core keeps a burst here from
    # contending with the api for the box's two cores.
    mem_limit: 512m
    cpus: 0.5
    # SIGTERM → the worker cancels in-flight jobs and leaves them queued for
    # its next start. Give it a moment to flush telemetry before SIGKILL.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No host port published: the api reaches db over the compose network.
    # Exposing port 5432 on 0.0.0.0 is prohibited to prevent public database access.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Roomier than it looks like it needs (RSS is ~178 MiB) because a container
    # memory limit also caps the page cache this cgroup can hold, and Postgres
    # leans on the OS page cache for reads. The whole database is 792 MB, so
    # 1.5g leaves real caching headroom rather than just covering shared_buffers
    # (128 MB) plus work_mem. An OOM kill here is far worse than no limit, so
    # this errs high.
    mem_limit: 1.5g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory + an eviction policy, because the default is unlimited with
    # `noeviction`: memory grew to 594 MB on a host with ~200 MB free, the
    # kernel swapped 539 MB of it to disk (33 MB resident), and a cache served
    # from swap is not a cache. `noeviction` also fails in the worst direction —
    # when full, Redis refuses new writes rather than dropping old entries.
    #
    # volatile-lru, NOT allkeys-lru: this instance is not purely a cache. It
    # also holds the JWT revocation blacklist, in-flight OTP codes, spend-guard
    # counters and the telemetry queue. allkeys-lru could evict the telemetry
    # queue (the one key with no TTL). volatile-lru only ever evicts keys that
    # carry an expiry, which is every cache entry and none of the queue.
    #
    # Persistence is kept but thinned to one hourly snapshot (default was three
    # save points, producing a 442 MB dump.rdb on a disk at 78%). It is kept
    # rather than disabled because a restart that lost the blacklist would
    # silently un-revoke every logged-out token until its natural expiry.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save 3600 1
    # Named, because redis:7-alpine declares VOLUME /data. Left anonymous, every
    # `compose up` that recreates this service abandons its volume — this host
    # already carries 51 dangling volumes totalling 5.2 GB.
    volumes:
      - redisdata:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # No host port published: the api reaches redis over the compose network
    # (REDIS_URL=redis://redis:6379/0). Publishing 6379 on the host collides
    # with the host-level redis-server that starts at boot.
    expose:
      - "6379"

volumes:
  pgdata:
  photo_cache:
  redisdata:
