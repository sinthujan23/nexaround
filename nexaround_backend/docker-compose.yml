version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://nexaround_app:NxAround_DB_2026_Secured_9a8b7c!@db:5432/nexaround_prod
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
    volumes:
      - ./app:/app/app
      # Persist proxied place photos across container restarts.
      - photo_cache:/app/app/static/photo_cache
      # Firebase service-account credential (read-only, kept outside the repo).
      - /etc/nexaround/firebase-sa.json:/etc/nexaround/firebase-sa.json:ro
    depends_on:
      - db
      - redis

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexaround_prod
      POSTGRES_USER: nexaround_app
      POSTGRES_PASSWORD: NxAround_DB_2026_Secured_9a8b7c!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port published: the api reaches redis over the compose network
    # (REDIS_URL=redis://redis:6379/0). Publishing 6379 on the host collides
    # with the host-level redis-server that starts at boot.
    expose:
      - "6379"

volumes:
  pgdata:
  photo_cache:
