<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NexAround Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="/admin/dashboard" class="sidebar-logo">
                <div class="logo-icon">
                    <i class="ti ti-map-pin"></i>
                </div>
                <div>
                    <span class="logo-text">NexAround</span>
                    <span class="logo-sub">CMS Phase 1</span>
                </div>
            </a>
            
            <div class="sidebar-section-label">Management</div>
            <nav>
                <a href="/admin/dashboard" class="sidebar-link {% if active_page == 'dashboard' %}active{% endif %}">
                    <i class="ti ti-layout-dashboard"></i>
                    <span>Mission Control</span>
                </a>
                <a href="/admin/attractions" class="sidebar-link {% if active_page == 'attractions' %}active{% endif %}">
                    <i class="ti ti-map"></i>
                    <span>Attractions</span>
                </a>
                <a href="/admin/categories" class="sidebar-link {% if active_page == 'categories' %}active{% endif %}">
                    <i class="ti ti-category"></i>
                    <span>Categories</span>
                </a>
                <a href="/admin/media" class="sidebar-link {% if active_page == 'media' %}active{% endif %}">
                    <i class="ti ti-photo"></i>
                    <span>Media Library</span>
                </a>

                <div class="sidebar-section-label">System</div>
                <a href="/admin/users" class="sidebar-link {% if active_page == 'users' %}active{% endif %}">
                    <i class="ti ti-users"></i>
                    <span>User Directory</span>
                </a>
                <a href="/admin/settings" class="sidebar-link {% if active_page == 'settings' %}active{% endif %}">
                    <i class="ti ti-settings"></i>
                    <span>General Settings</span>
                </a>
            </nav>

            <div style="margin-top: auto; padding-top: 2rem;">
                <a href="/admin/logout" class="sidebar-link" style="color: rgba(239, 68, 68, 0.8);">
                    <i class="ti ti-logout"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <span style="font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em;">{% block page_title %}Mission Control{% endblock %}</span>
                </div>
                <div class="topbar-right">
                    <div style="display: flex; align-items: center; gap: 1.25rem;">
                        <div style="text-align: right;">
                            <div style="font-size: 0.8125rem; font-weight: 700; color: var(--text);">Admin User</div>
                            <div style="font-size: 0.7rem; color: var(--muted); font-weight: 600; text-transform: uppercase;">Super Admin</div>
                        </div>
                        <div style="width: 40px; height: 40px; border-radius: 12px; background: var(--brand-light); color: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 800; border: 1px solid rgba(99,102,241,0.1);">A</div>
                    </div>
                </div>
            </header>

            <div class="page-body animate-up">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
