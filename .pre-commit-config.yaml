# Secret-scanning for NexAround. Stops a .env (or any credential) being
# committed again — the root cause of the secrets found in this repo's history.
#
# One-time setup (per clone):
#   pip install pre-commit            # or: pipx install pre-commit
#   pre-commit install                # installs the git hook
#
# From then on, `git commit` runs gitleaks on the staged diff and blocks the
# commit if it finds a secret. To scan the whole working tree on demand:
#   pre-commit run --all-files
#
# Pinned to an exact gitleaks release tag (not a moving ref) so the check is
# reproducible and the pinned action cannot change under us.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # A few cheap guards that catch the obvious mistakes before gitleaks even runs.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key        # blocks committed PEM/SSH private keys
      - id: check-added-large-files    # stops accidental blobs / dumps
        args: ["--maxkb=2048"]
